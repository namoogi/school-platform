name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['54322:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:54322/school_platform
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Create database
        run: psql -h 127.0.0.1 -p 54322 -U postgres -c "create database school_platform"
      - run: npm test
      - run: npm run build
      - name: Install Playwright (개발 환경과 같은 버전, package.json에는 넣지 않음)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
