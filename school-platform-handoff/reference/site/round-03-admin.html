<!doctype html>
<html lang="ko">
<head>

<title>학교 운영 플랫폼 · 교직원 시안</title>
<style>
:root{--ink:#19273a;--mute:#536478;--line:#dde5ed;--surface:#f4f7fb;--nav:#142b45;--blue:#2458cc;--blue-bg:#eaf1ff;--green:#17624c;--green-bg:#e5f5ee;--amber:#80501f;--amber-bg:#fff2dd;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--surface);font-size:16px}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #7ba7ff;outline-offset:2px}button{border:0}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.75rem,4vw,2.5rem);letter-spacing:-.055em}h2{font-size:1.2rem;letter-spacing:-.03em}h3{font-size:1rem}p{line-height:1.6}.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.rail{background:var(--nav);color:white;display:flex;flex-direction:column;padding:30px 17px;gap:24px}.brand{display:flex;gap:12px;align-items:center;padding:0 7px}.mark{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#d5e6ff;color:#183d84;font-weight:850;flex:none}.brand strong{display:block;font-size:1rem}.brand small{font-size:.78rem;color:#cad8eb}.rail nav{display:grid;gap:5px}.nav{display:flex;gap:11px;align-items:center;text-align:left;padding:11px 12px;background:transparent;color:#e3edfa;border-radius:8px;font-weight:650;white-space:nowrap}.nav:hover,.nav[aria-current=page]{background:#27466c;color:#fff}.nav-icon{width:19px;text-align:center;color:#bcd8ff}.rail-foot{margin-top:auto;color:#c6d6e8;font-size:.83rem;padding:0 8px}.top{height:61px;background:#fff;border-bottom:1px solid var(--line);padding:0 clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:.88rem}.content{max-width:1380px;margin:auto;padding:30px clamp(18px,4vw,48px) 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.sub{color:var(--mute);margin-top:7px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:.79rem;font-weight:730;white-space:nowrap;background:var(--blue-bg);color:#21499e}.pill.green{background:var(--green-bg);color:var(--green)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.muted{background:#ecf0f4;color:#44556b}.primary,.secondary,.quiet{padding:10px 15px;font-weight:720;border-radius:8px;min-height:42px;white-space:nowrap}.primary{background:var(--blue);color:white}.primary:hover{background:#1746ae}.secondary{color:var(--ink);background:#fff;border:1px solid #cdd8e3}.secondary:hover,.quiet:hover{background:#f1f5fa}.quiet{color:var(--blue);background:transparent}.split{display:grid;grid-template-columns:minmax(235px,.75fr) minmax(0,1.65fr);gap:16px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.pad{padding:21px}.list-title{padding:17px 17px 12px}.row{display:block;width:100%;text-align:left;background:#fff;padding:15px 17px;border-top:1px solid var(--line);color:var(--ink)}.row:hover,.row[aria-pressed=true]{background:#edf4ff}.row[aria-pressed=true]{box-shadow:inset 3px 0 var(--blue)}.row strong{display:block;margin:7px 0 3px}.muted,.meta{color:var(--mute)}.meta{font-size:.83rem}.row-top,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.details-title{margin-top:10px;font-size:clamp(1.25rem,3vw,1.6rem)}.flow{display:flex;list-style:none;padding:0;margin:19px 0;gap:5px;flex-wrap:wrap}.flow li{background:#edf1f5;color:#516071;padding:7px 10px;border-radius:6px;font-size:.8rem}.flow li.current{color:#174598;background:#e5eeff;font-weight:750}.flow li.past{color:#175c4a;background:var(--green-bg)}.section{border-top:1px solid var(--line);margin-top:19px;padding-top:18px}.section h3{margin-bottom:8px}.section p{font-size:.95rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.note{border-radius:8px;background:#f0f5fd;padding:12px 14px;margin-top:12px;color:#294770}.note.amber{background:var(--amber-bg);color:#65401a}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.opt:has(input:checked){border-color:#6087e5;background:#f2f6ff}.opt input{margin:0 8px 0 0;accent-color:var(--blue)}.opt p{margin:4px 0 0 24px;color:var(--mute)}label.field{display:grid;gap:7px;margin:13px 0;font-weight:660}input[type=text],input[type=number],textarea{width:100%;color:var(--ink);background:white;border:1px solid #b9c9da;border-radius:8px;padding:10px 11px}textarea{resize:vertical;min-height:90px}dialog{width:min(620px,calc(100% - 28px));max-height:calc(100% - 28px);border:1px solid var(--line);padding:22px;border-radius:14px;color:var(--ink);box-shadow:0 24px 70px #10264250}dialog::backdrop{background:#15294383}.close{font-size:1.25rem;background:none;color:var(--mute);width:36px;height:36px;border-radius:6px}.close:hover{background:#e9eef5}.matrix{width:100%;border-collapse:collapse;margin-top:13px;text-align:left;font-size:.9rem}.matrix td,.matrix th{padding:10px 7px;border-bottom:1px solid var(--line)}.matrix th{color:var(--mute);font-size:.83rem}.matrix td:last-child,.matrix th:last-child{text-align:right}.media-art{aspect-ratio:2.15;min-height:112px;background:radial-gradient(ellipse at 88% 94%,#a9dcba 0 18%,transparent 18.5%),radial-gradient(ellipse at 89% 110%,#d6ebbb 0 36%,transparent 36.5%),radial-gradient(ellipse at 85% 15%,#ffdd84 0 14%,transparent 14.5%),#17374f;border-radius:9px;display:grid;align-content:center;padding:17px;color:#fff;overflow:hidden}.media-art b{font-size:clamp(1.25rem,4vw,2.2rem);letter-spacing:-.03em}.media-art small{color:#dfeaf4}.usage{display:grid;gap:15px;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}.metric strong{font-size:clamp(1.3rem,3vw,2rem);display:block;margin:8px 0;letter-spacing:-.04em}.meter{height:7px;border-radius:20px;background:#e6edf8;margin:13px 0 5px;overflow:hidden}.meter span{display:block;height:100%;background:#346bde}.alert{font-size:.88rem;font-weight:670;color:#a12630;min-height:1em;margin-top:8px}.toast{position:fixed;bottom:20px;right:20px;max-width:calc(100% - 40px);background:#183b56;color:#fff;border-radius:8px;padding:12px 16px;z-index:10;box-shadow:0 6px 20px #10264230}.toast:empty{display:none}.cover{margin:12px 0}.hint{margin:8px 0 0}.status-ok{color:var(--green);font-weight:720}
@media(max-width:920px){.layout{grid-template-columns:190px minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr)}.list{display:grid;grid-template-columns:1fr 1fr}.list-title{grid-column:1/-1}}
@media(max-width:650px){.layout{display:block}.rail{padding:12px 14px;gap:12px}.rail nav{display:flex;overflow:auto}.brand{padding:0}.mark{width:35px;height:35px}.rail-foot{display:none}.nav{font-size:.87rem;padding:8px 9px}.nav-icon{display:none}.top{height:47px}.content{padding-top:20px}.head{align-items:flex-start}.head .primary{padding-inline:10px;font-size:.86rem}.pad{padding:16px}.usage{grid-template-columns:1fr}.list{display:block}.matrix{font-size:.82rem}}
</style>
</head>
<body>
<div class="layout">
<aside class="rail">
  <div class="brand"><div class="mark" aria-hidden="true">RA</div><div><strong>룽아룬숙사</strong><small>학교 운영 플랫폼</small></div></div>
  <nav aria-label="주 메뉴">
    <button type="button" class="nav" data-screen="academics" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span>학사 운영</button>
    <button type="button" class="nav" data-screen="requests"><span class="nav-icon" aria-hidden="true">▤</span>변경 요청</button>
    <button type="button" class="nav" data-screen="website"><span class="nav-icon" aria-hidden="true">▣</span>홈페이지 편집</button>
    <button type="button" class="nav" data-screen="usage"><span class="nav-icon" aria-hidden="true">▥</span>사용량·결제</button>
  </nav>
  <div class="rail-foot">교직원 작업공간</div>
</aside>
<div>
  <header class="top"><span>교직원 관리자</span><div class="review-links"><a href="round-03.html" target="_blank" rel="noopener" title="새 탭에서 열기">학교 홈페이지</a><a href="round-02.html" target="_blank" rel="noopener" title="새 탭에서 열기">2차 보기</a><span class="pill muted">3차 · 가상 데이터</span></div></header>
  <main id="main" class="content"></main>
</div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const main = document.querySelector('#main');
const dialog = document.querySelector('#dialog');
const toast = document.querySelector('#toast');
const monthlyLimit = 50000;
const imageLimit = 30;
const demoCharge = 2800;
const initialRequests = [
  { id: 104, title: '학년별 행사 준비 현황 추가', description: '북페어를 준비하는 교직원이 학년별 준비 상태와 담당자를 한 화면에서 확인할 수 있도록 해 주세요.', stage: 1, method: '', cap: 6000, charge: 0, seen: false },
  { id: 103, title: '학사일정 공개 범위 설정', description: '홈페이지에 공개할 일정과 교직원만 보는 일정을 선택할 수 있도록 했습니다.', stage: 3, method: 'direct', cap: 0, charge: 0, seen: true }
];
const state = {
  screen: ['academics', 'requests', 'website', 'usage'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'academics', selected: 104, nextId: 105, requests: initialRequests,
  used: 12400, images: 12, candidate: false, saved: false, inserted: false,
  prompt: '어린이 북페어. 펼친 그림책과 나뭇잎을 활용한 가로 배너',
  title: '11월 어린이 북페어 안내', body: '학년별 그림책 읽기와 책 나눔 활동을 진행합니다.', published: false
};
const adminStorage = 'school-review-round-03-admin';
const homepageStorage = 'school-review-round-03-homepage';
try {
  const saved = JSON.parse(localStorage.getItem(adminStorage));
  if (saved) Object.assign(state, saved, {screen: state.screen});
} catch {}
const money = value => new Intl.NumberFormat('ko-KR').format(value) + '원';
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stageNames = ['요청', '작업 방식', '미리보기', '배포'];
function notice(message) {
  toast.textContent = message;
  window.clearTimeout(notice.timer);
  notice.timer = window.setTimeout(() => { toast.textContent = ''; }, 4000);
}
function header(title, sub, action = '') {
  return '<div class="head"><div><h1>' + title + '</h1><p class="sub">' + sub + '</p></div>' + action + '</div>';
}
function status(request) {
  if (request.stage === 3) return '<span class="pill green">배포 완료</span>';
  if (request.stage === 2) return '<span class="pill amber">승인 대기</span>';
  return '<span class="pill">실행 방식 선택</span>';
}
function renderRequests() {
  const r = state.requests.find(request => request.id === state.selected);
  const rows = state.requests.map(item =>
    '<button class="row" data-action="select" data-id="' + item.id + '" aria-pressed="' + (item.id === r.id) + '"><span class="row-top"><span class="meta">요청 #' + item.id + '</span>' + status(item) + '</span><strong>' + escape(item.title) + '</strong></button>').join('');
  const steps = stageNames.map((name, i) => '<li class="' + (i === r.stage ? 'current' : i < r.stage ? 'past' : '') + '"' + (i === r.stage ? ' aria-current="step"' : '') + '>' + name + '</li>').join('');
  let controls = '';
  if (r.stage === 1) controls = `
    <form id="run-form" class="section">
      <h3>작업 방식 선택</h3>
      <label class="opt"><input type="radio" name="method" value="direct" ${r.method === 'direct' ? 'checked' : ''}> <strong>자체 Claude 구독</strong><p>학교 담당자가 Claude Code에서 직접 작업</p></label>
      <label class="opt"><input type="radio" name="method" value="api" ${r.method !== 'direct' ? 'checked' : ''}> <strong>API 사용량 결제</strong><p>포털에서 작업 실행 · 월 잔액 ${money(monthlyLimit - state.used)}</p></label>
      <div id="cap-box" ${r.method === 'direct' ? 'hidden' : ''}>
        <label class="field">이 작업의 최대 비용 (원)<input type="number" name="cap" min="100" step="100" value="${r.cap}" required ${r.method === 'direct' ? 'disabled' : ''}></label>
      </div>
      <p id="run-error" class="alert" role="alert"></p>
      <div class="actions"><button class="primary" id="run-button">${r.method === 'direct' ? '작업 안내 보기' : '비용 확인 후 실행'}</button></div>
    </form>`;
  if (r.stage === 2) controls = `
    <div class="section"><h3>배포 승인</h3>
    <p>${r.method === 'api' ? 'API 사용료 ' + money(r.charge) + ' · 승인 한도 ' + money(r.cap) : '자체 Claude 구독으로 작업 · 플랫폼 API 차감 없음'}</p>
    <p class="note">${r.seen ? '미리보기 확인 완료 · 아래 버튼으로 이 변경을 승인합니다.' : '변경 결과를 미리보기에서 확인해 주세요.'}</p>
    <div class="actions"><button data-action="preview" class="${r.seen ? 'secondary' : 'primary'}">미리보기 열기</button>
    <button data-action="approve" class="${r.seen ? 'primary' : 'secondary'}" ${r.seen ? '' : 'disabled'}>승인 및 배포</button></div></div>`;
  if (r.stage === 3) controls = `<div class="section"><h3 class="status-ok">운영 반영 완료</h3><p>${r.method === 'api' ? '확정 작업 비용 ' + money(r.charge) : '자체 구독 작업 · 플랫폼 API 차감 없음'}</p><div class="actions"><button class="secondary" data-action="preview">결과 보기</button></div></div>`;
  main.innerHTML = header('변경 요청','학교별 기능을 요청하고, 미리보기에서 확인한 뒤 반영합니다.','<button class="primary" data-action="new">새 변경 요청</button>') +
    '<div class="split"><section class="card list" aria-label="요청 목록"><h2 class="list-title">요청 목록</h2>' + rows + '</section><section class="card pad"><div class="between"><span class="meta">요청 #' + r.id + '</span>' + status(r) + '</div><h2 class="details-title">' + escape(r.title) + '</h2><ol class="flow" aria-label="요청 진행 상황">' + steps + '</ol><div class="section"><h3>요청 내용</h3><p>' + escape(r.description) + '</p></div>' + controls + '</section></div>';
}
function art() {
  return '<div class="media-art cover" role="img" aria-label="시안용 북페어 배너"><b>어린이 북페어</b><small>Rung Arun Suksa School</small></div>';
}
function renderWebsite() {
  const result = state.candidate ? art() + (state.saved ? '<p class="status-ok">학교 미디어함에 저장됨</p><button class="secondary" data-action="insert"' + (state.inserted ? ' disabled' : '') + '>' + (state.inserted ? '공지에 삽입됨' : '공지에 삽입') + '</button>' : '<button class="secondary" data-action="save-image">미디어함에 저장</button>') : '<p class="muted hint">생성 결과는 여기에서 확인합니다.</p>';
  main.innerHTML = header('홈페이지 편집','공지 본문을 작성하고 학교 미디어함의 이미지를 넣습니다.','<a class="primary" style="text-decoration:none" href="round-03.html?edit=1" target="_blank" rel="noopener" title="새 탭에서 열기">페이지 바로 편집</a>') + `
    <div class="split"><section class="card pad">
      <div class="between"><h2>이미지 만들기</h2><span class="pill">Gemini</span></div>
      <p class="sub">이번 달 ${imageLimit - state.images}장 남음</p>
      <form id="image-form"><label class="field">이미지 설명<textarea name="prompt" required maxlength="600">${escape(state.prompt)}</textarea></label><button class="primary" ${state.images >= imageLimit ? 'disabled' : ''}>이미지 생성 시연</button></form>
      <div class="section">${result}</div>
    </section>
    <section class="card pad"><div class="between"><h2>공지 편집기</h2><span class="pill ${state.published ? 'green' : 'muted'}">${state.published ? '공개됨 (시안)' : '초안'}</span></div>
      <form id="notice-form"><label class="field">제목<input type="text" name="title" required maxlength="100" value="${escape(state.title)}"></label>
      <label class="field">본문<textarea name="body" required maxlength="2000">${escape(state.body)}</textarea></label>
      ${state.inserted ? art() + '<button type="button" class="quiet" data-action="remove-cover">삽입 이미지 제거</button>' : '<p class="muted">삽입된 이미지 없음</p>'}
      <div class="actions"><button class="primary">공지 발행 시연</button></div></form></section></div>`;
}
function renderUsage() {
  const rows = state.requests.filter(r => r.method === 'api' && r.charge).map(r => '<tr><td>#' + r.id + ' ' + escape(r.title) + '</td><td>' + money(r.cap) + '</td><td>' + money(r.charge) + '</td></tr>').join('');
  main.innerHTML = header('사용량·결제','학교 기본료, 이미지 제작, 기능 변경 비용을 확인합니다.') + `
    <div class="usage">
      <section class="card pad metric"><h2>학교 운영</h2><strong>월 기본료</strong><p class="muted">홈페이지 · 학사운영 · 저장 공간</p></section>
      <section class="card pad metric"><h2>콘텐츠 제작</h2><strong>${state.images} / ${imageLimit}장</strong><div class="meter" aria-hidden="true"><span style="width:${state.images / imageLimit * 100}%"></span></div><p class="muted">Gemini 이미지 · 이번 달</p></section>
      <section class="card pad metric"><h2>API 기능 변경</h2><strong>${money(state.used)}</strong><div class="meter" aria-hidden="true"><span style="width:${state.used / monthlyLimit * 100}%"></span></div><p class="muted">월 한도 ${money(monthlyLimit)}</p></section>
    </div>
    <section class="card pad"><h2>API 작업 정산 내역</h2><p class="sub">시연용 금액입니다.</p><table class="matrix"><thead><tr><th scope="col">변경 요청</th><th scope="col">최대 승인액</th><th scope="col">실제 차감</th></tr></thead><tbody>${rows}<tr><td>이전 작업 합계</td><td>—</td><td>12,400원</td></tr></tbody></table></section>`;
}
function render() {
  for (const button of document.querySelectorAll('[data-screen]')) {
    if (button.dataset.screen === state.screen) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  }
  if (state.screen === 'academics') renderAcademics();
  if (state.screen === 'requests') renderRequests();
  if (state.screen === 'website') renderWebsite();
  if (state.screen === 'usage') renderUsage();
  try { const {screen, ...saved} = state; localStorage.setItem(adminStorage, JSON.stringify(saved)); } catch {}
}
function showDialog(title, body) {
  dialog.innerHTML = '<div class="between"><h2 id="dialog-title">' + title + '</h2><button type="button" class="close" data-action="close" aria-label="닫기">×</button></div>' + body;
  if (!dialog.open) dialog.showModal();
}
function showPreview(r) {
  let example = '<p class="note">새 요청 시연에서는 요청 내용과 승인 흐름을 확인할 수 있습니다.</p>';
  if (r.id === 104) example = `<table class="matrix"><thead><tr><th scope="col">학년</th><th scope="col">담당</th><th scope="col">준비 상태</th></tr></thead><tbody><tr><td>초등 1학년</td><td>교사 A</td><td>완료</td></tr><tr><td>초등 2학년</td><td>교사 B</td><td>준비 중</td></tr><tr><td>초등 3학년</td><td>교사 C</td><td>확인 필요</td></tr></tbody></table>`;
  if (r.id === 103) example = '<p class="note">공개 일정 · 북페어<br>교직원만 · 행사 준비 회의</p>';
  showDialog('변경 미리보기', '<p class="sub">요청 #' + r.id + ' · 가상 자료</p><div class="section"><h3>' + escape(r.title) + '</h3>' + example + '</div><div class="actions"><button class="primary" data-action="review">' + (r.stage === 3 ? '닫기' : '확인 완료') + '</button></div>');
}
function finishRun(method, cap = 0) {
  const r = state.requests.find(item => item.id === state.selected);
  if (r.stage !== 1) return;
  const charge = method === 'api' ? Math.min(cap, demoCharge) : 0;
  if (method === 'api' && cap > monthlyLimit - state.used) {
    dialog.close();
    document.querySelector('#run-error').textContent = '작업 최대 비용이 월 잔액을 초과합니다.';
    return;
  }
  r.method = method;
  r.stage = 2;
  r.cap = cap;
  r.charge = charge;
  state.used += charge;
  dialog.close();
  render();
  notice('미리보기 준비 완료');
}
document.addEventListener('input', event => {
  const { target } = event;
  if (target.form?.id === 'notice-form') {
    if (target.name === 'title' || target.name === 'body') {
      state[target.name] = target.value;
      if (state.published) {
        state.published = false;
        const badge = main.querySelector('#notice-form').parentElement.querySelector('.pill');
        badge.className = 'pill muted';
        badge.textContent = '초안';
      }
    }
  }
  if (target.form?.id === 'image-form' && target.name === 'prompt') state.prompt = target.value;
  if (target.form?.id === 'run-form' && target.name === 'cap') {
    state.requests.find(item => item.id === state.selected).cap = Number(target.value);
  }
});
document.addEventListener('change', event => {
  if (event.target.name !== 'method') return;
  const r = state.requests.find(item => item.id === state.selected);
  r.method = event.target.value;
  const direct = r.method === 'direct';
  document.querySelector('#cap-box').hidden = direct;
  document.querySelector('[name=cap]').disabled = direct;
  document.querySelector('#run-button').textContent = direct ? '작업 안내 보기' : '비용 확인 후 실행';
  document.querySelector('#run-error').textContent = '';
});
document.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  if (form.id === 'run-form') {
    const r = state.requests.find(item => item.id === state.selected);
    if (data.get('method') === 'direct') {
      showDialog('자체 Claude 구독으로 작업', '<p class="sub">요청 #' + r.id + ' · 학교 담당자가 공식 Claude Code에 직접 로그인해 지정 브랜치에서 작업합니다.</p><div class="section"><h3>작업 브랜치</h3><p><code>school/request-' + r.id + '</code></p></div><div class="actions"><button class="primary" data-action="submit-direct">작업 결과 등록 시연</button></div>');
    } else {
      r.cap = Number(data.get('cap'));
      if (r.cap > monthlyLimit - state.used) {
        document.querySelector('#run-error').textContent = '작업 최대 비용이 월 잔액을 초과합니다.';
        return;
      }
      showDialog('API 작업 비용 확인', '<div class="section"><p>작업 최대 비용 <strong>' + money(r.cap) + '</strong></p><p>현재 월 잔액 ' + money(monthlyLimit - state.used) + '</p><p class="note">작업 완료 후 실제 사용량으로 정산합니다. 이 화면은 시연용입니다.</p></div><div class="actions"><button class="primary" data-action="confirm-api">비용 승인 및 실행 시연</button></div>');
    }
  }
  if (form.id === 'new-form') {
    const title = String(data.get('title')).trim();
    const description = String(data.get('description')).trim();
    if (!title || !description) { form.querySelector('.alert').textContent = '제목과 요청 내용을 입력해 주세요.'; return; }
    state.selected = state.nextId++;
    state.requests.unshift({id:state.selected,title,description,stage:1,method:'',cap:6000,charge:0,seen:false});
    dialog.close();
    render();
    notice('새 요청을 등록했습니다.');
  }
  if (form.id === 'image-form' && state.images < imageLimit) {
    if (!state.prompt.trim()) { notice('이미지 설명을 입력해 주세요.'); return; }
    state.images++;
    state.candidate = true;
    state.saved = false;
    render();
    notice('시연 이미지가 준비됐습니다.');
  }
  if (form.id === 'notice-form') {
    if (!state.title.trim() || !state.body.trim()) { notice('공지 제목과 본문을 입력해 주세요.'); return; }
    state.published = true;
    try {
      const page = JSON.parse(localStorage.getItem(homepageStorage)) || {};
      localStorage.setItem(homepageStorage, JSON.stringify({...page, newsTitle:state.title.trim(), newsText:state.body.trim()}));
    } catch {}
    render();
    notice('시안 상태에서 공지를 발행했습니다.');
  }
});
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.screen) { state.screen = button.dataset.screen; history.replaceState(null, '', '#' + state.screen); render(); return; }
  const r = state.requests.find(item => item.id === state.selected);
  switch (button.dataset.action) {
    case 'select': state.selected = Number(button.dataset.id); render(); break;
    case 'new':
      showDialog('새 변경 요청','<form id="new-form"><label class="field">제목<input type="text" name="title" required maxlength="80" placeholder="예: 기숙사 저녁 점호 화면 추가"></label><label class="field">요청 내용<textarea name="description" maxlength="600" required placeholder="누가 어떤 일을 할 수 있어야 하나요?"></textarea></label><p class="alert" role="alert"></p><div class="actions"><button class="primary">요청 등록</button></div></form>');
      dialog.querySelector('input').focus();
      break;
    case 'close': dialog.close(); break;
    case 'submit-direct': finishRun('direct'); break;
    case 'confirm-api': finishRun('api', r.cap); break;
    case 'preview': showPreview(r); break;
    case 'review':
      r.seen = true; dialog.close(); render();
      main.querySelector('[data-action=approve]')?.focus();
      break;
    case 'approve':
      if (!r.seen || r.stage !== 2) break;
      showDialog('운영 배포 승인','<p class="sub">요청 #' + r.id + '의 미리보기 버전을 운영에 반영합니다.</p><div class="actions"><button class="primary" data-action="deploy">배포 확정 시연</button></div>');
      break;
    case 'deploy':
      if (r.stage !== 2 || !r.seen) break;
      r.stage = 3; dialog.close(); render(); notice('시안 상태에서 배포를 완료했습니다.'); break;
    case 'save-image': state.saved = true; render(); notice('학교 미디어함에 저장했습니다.'); break;
    case 'insert': if (!state.saved) break; state.inserted = true; state.published = false; render(); notice('공지에 이미지를 넣었습니다.'); break;
    case 'remove-cover': state.inserted = false; state.published = false; render(); break;
  }
});
</script>
<script src="academics-r02.js"></script>
<script>
try { sessionStorage.setItem("school-review-role", "admin"); } catch {}
render();
</script>
